name: CI + Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write  # 需要写权限来创建 Release

jobs:
  test:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
    - name: Run tests
      run: |
        xcodebuild clean test \
          -project FUnlock.xcodeproj \
          -scheme FUnlock \
          -destination 'platform=macOS' \
          -enableCodeCoverage YES \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Build release
      run: |
        xcodebuild archive \
          -project FUnlock.xcodeproj \
          -scheme FUnlock \
          -archivePath build/FUnlock.xcarchive \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
    - name: Package DMG
      run: |
        # 创建临时目录
        mkdir -p dmg-staging
        cp -R build/FUnlock.xcarchive/Products/Applications/FUnlock.app dmg-staging/

        # 创建 Applications 软链接
        ln -s /Applications dmg-staging/Applications

        # 创建 DMG
        hdiutil create -volname "FUnlock" \
          -srcfolder dmg-staging \
          -ov -format UDZO \
          build/FUnlock.dmg

        # 清理临时目录
        rm -rf dmg-staging

        echo "DMG created: build/FUnlock.dmg"
        ls -lh build/FUnlock.dmg
    - name: Upload DMG to Release
      uses: softprops/action-gh-release@v2
      with:
        files: build/FUnlock.dmg
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
